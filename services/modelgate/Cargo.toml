[package]
name = "modelgate"
version = "0.1.0"
edition = "2021"
description = "The only exit to a language model: decide calls behind an attempt ledger, a cost cap and a pinned build."
publish = false

# `ureq` here is the second and last name on `repo_invariants::clients::CLIENT_ALLOWLIST`
# (docs/design/architecture.md section 8 row R4). Same version and features as `news-provider`,
# so Cargo.lock gains this crate alone (`git diff Cargo.lock`, 2026-11-23). The body is sent as
# bytes this crate serialised, so ureq's `json` feature stays off.
[dependencies]
canon = { path = "../../canon" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.42.0", features = ["backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snapshot-contract = { path = "../../snapshot-contract" }
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
