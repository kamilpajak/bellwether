[package]
name = "newsvault"
version = "0.1.0"
edition = "2021"
description = "Point-in-time news archive for AlphaLens: complete, append-only, honestly timestamped."
publish = false

[dependencies]
anyhow = "1.0.104"
arrow = "60.1.0"
canon = { path = "../../canon" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
const-hex = "1.19.3"
# The driver registers the providers, so every adapter is a dependency of it.
edgar-press = { path = "../../providers/edgar-press" }
news-provider = { path = "../../news-provider" }
open-web-feed = { path = "../../providers/open-web-feed" }
parquet = "60.1.0"
pit = { path = "../../pit" }
# No `bundled` feature: `libsqlite3-sys` links the system library, so CI gains no C compile.
# The SQLite versions it then links on the Mac and the VPS: docs/design/architecture.md section 6.
rusqlite = { version = "0.42.0", features = ["backup"] }
# SEC's transport for the roster, which is no news adapter's to give.
sec-edgar = { path = "../../providers/sec-edgar" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snapshot-contract = { path = "../../snapshot-contract" }
# Writes the backup's blob packs; no default features, so no `xattr`.
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
vault-core = { path = "../../vault-core" }
# The version parquet already pulls in; defaults off so only the dictionary trainer is added.
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
# Every test, and the binary the tests spawn, sends to loopback only: section 8 row N1.
news-provider = { path = "../../news-provider", features = ["loopback-only"] }
