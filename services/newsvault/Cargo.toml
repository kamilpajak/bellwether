[package]
name = "newsvault"
version = "0.1.0"
edition = "2021"
description = "Point-in-time news archive for AlphaLens: complete, append-only, honestly timestamped."
publish = false

[dependencies]
anyhow = "1.0.104"
arrow = "60.1.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
parquet = "60.1.0"
pit = { path = "../../pit" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
