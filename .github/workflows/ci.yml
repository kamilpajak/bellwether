# The gate: it is what turns "a test exists" into "a test ran" (docs/design/architecture.md
# section 8 row R2, which this workflow is the enforcement point of), and what it does NOT cover is
# that section's own table. The
# commands must stay the ones README.md names - CONTRIBUTING.md, "Everything else".
#
# No toolchain setup step: the GitHub ubuntu runner image installs cargo, rustfmt and clippy
# (images/ubuntu/scripts/build/install-rust.sh in actions/runner-images runs
# `rustup component add rustfmt clippy`; the image readme lists rustfmt but not clippy, so the
# build script is the authority), so the compiler floats with the image and a new clippy lint can
# turn this red with no commit here. No dependency cache: measured 2026-11-12 over the five runs
# on this runner, the whole job wall clock was 71-93 s, so a cache would save less than it costs.

name: ci

on: [push, pull_request]

# Nothing here publishes, comments or tags, so third-party action code gets no write token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The work is under a minute, and the default bound is six hours of a required status check
    # held by a hung step. A timed-out run surfaces as a cancellation, not a failure.
    timeout-minutes: 15
    steps:
      # Pinned to the commit behind release v7.0.1 (committed 2026-07-17, released 2026-07-20).
      # A moving tag such as @v7 is a standing grant of write access to this gate, and a
      # reproducibility hole: two runs of one repository commit can execute different action code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      # "!cancelled()" keeps the step running after an earlier step failed while still skipping it
      # when the run is cancelled, so one run reports all three verdicts instead of stopping at a
      # formatting diff. The price: a failed checkout yields three "could not find Cargo.toml".
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      # --no-fail-fast: cargo stops at the first failing test target and the compile_fail doc test
      # is a separate target that runs last. Measured on this tree, with one unit test failing
      # plain `cargo test` exited 101 without printing "Doc-tests newsvault" - R2's only gate.
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
      # Rule 1 of CONTRIBUTING.md, which prints the ratio and gates nothing. It also counts
      # `probes/`, which nothing checks: no step runs a Python tool or builds a probe crate.
      - if: ${{ !cancelled() }}
        name: size (test lines vs source lines, rule 1)
        run: |
          # Per file, not "-exec ... {} +": awk's exit ends the whole invocation, so one batched
          # call stops counting at the first file holding a test module. The first version of this
          # step did exactly that and reported 2.56x on a 1,026-line crate.
          src=0; tst=0; multi=''
          while IFS= read -r f; do
            all=$(wc -l < "$f")
            # The scan below stops at the FIRST marker, so a second one moves every source line
            # below it into the test column. The rule is repo-invariants::layout, which is what
            # `cargo test` shows; this is the reader that fails a push.
            if [ "$(grep -c '^ *#\[cfg(test)\]' "$f")" -gt 1 ]; then multi="$multi $f"; fi
            case "$f" in
              # An integration-test target carries no `#[cfg(test)]` marker, so the scan below
              # would count every line of it as source and report a ratio that falls when a test
              # file is added. Such a file is test from its first line.
              */tests/*.rs) head=0 ;;
              *) head=$(awk '/^ *#\[cfg\(test\)\]/{exit} {n++} END{print n+0}' "$f") ;;
            esac
            src=$((src + head)); tst=$((tst + all - head))
          # Every crate, not just `services`: measured 2026-11-12, the two gate crates hold 2,233
          # of the tree's 3,531 Rust lines, and a ratio that leaves them out is not the repository's.
          # `probes/` is outside the ratio: a probe crate is not product source, and its local
          # `target/` holds generated .rs files.
          done < <(find . -name '*.rs' -not -path './target/*' -not -path './probes/*')
          probes=$(find probes \( -name '*.py' -o -name '*.rs' \) -not -path '*/target/*' \
            -exec cat {} + | wc -l)
          doc=$(find docs -name '*.md' -exec cat {} + | wc -l)
          # Doc-test lines sit BEFORE `#[cfg(test)]` and are counted as source above, which is one
          # of the two things the ratio's own instrument could not see (the other is `probes`,
          # printed outside the ratio since the step existed). Fenced blocks in `//!`/`///`
          # comments, fence lines included.
          dt=$(find . -name '*.rs' -not -path './target/*' -not -path './probes/*' -exec cat {} + \
            | awk '/^ *\/\/[\/!] ```/{n++; inb=!inb} inb{n++} END{print n+0}')
          printf 'rust source %6d\nrust tests  %6d  ratio %s\nin source, doc tests %6d\nprobes      %6d\ndocs (md)   %6d\n' \
            "$src" "$tst" "$(awk -v a=$tst -v b=$src 'BEGIN{printf "%.2fx", (b?a/b:0)}')" \
            "$dt" "$probes" "$doc"
          if [ -n "$multi" ]; then
            echo "more than one #[cfg(test)] line, so the two columns above are wrong for:$multi" >&2
            exit 1
          fi
        shell: bash
