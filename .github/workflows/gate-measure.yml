# The send gate measured on Linux: docs/design/architecture.md section 12.6, rules L1 to L5, each
# written before the run it judges. Not part of the gate: it starts by hand, prints numbers and
# asserts nothing. It runs again when the send gate, the pace or SEC's margin changes, and before
# the deploy of a second sending process (section 12.8 step 10).

name: gate-measure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    # The release ci.yml tests on, which is the Dockerfile's.
    runs-on: ubuntu-24.04
    # Four runs of 300 s to 1,350 s, 3,440 s in all (rule L5's count rule), and one release build.
    timeout-minutes: 90
    steps:
      # Pinned as in ci.yml, for the reason stated there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the toolchain is rust-toolchain.toml's
        run: rustup toolchain install
      - name: the runner
        run: |
          echo "image ${ImageOS:-} ${ImageVersion:-}"
          uname -sr
          echo "cpus $(nproc)"
          findmnt --noheadings --output FSTYPE --target "${RUNNER_TEMP:-/tmp}"
      - name: build the instrument
        run: cargo test --locked --release -p news-provider --test shared_bucket --no-run
      - name: two senders at 100 ms, 1,500 sends each (bound A2 240 ms)
        if: ${{ !cancelled() }}
        env:
          SHARED_BUCKET_MEASURE: a:100:1500:0:true:127.0.0.1,b:100:1500:0:true:127.0.0.1
        run: cargo test --locked --release -p news-provider --test shared_bucket -- --ignored --nocapture measure
      - name: three senders at 100 ms, 1,700 sends each (bound A2 360 ms)
        if: ${{ !cancelled() }}
        env:
          SHARED_BUCKET_MEASURE: a:100:1700:0:true:127.0.0.1,b:100:1700:0:true:127.0.0.1,c:100:1700:0:true:127.0.0.1
        run: cargo test --locked --release -p news-provider --test shared_bucket -- --ignored --nocapture measure
      - name: eight senders at 100 ms, 1,600 sends each (bound A2 960 ms)
        if: ${{ !cancelled() }}
        env:
          SHARED_BUCKET_MEASURE: a:100:1600:0:true:127.0.0.1,b:100:1600:0:true:127.0.0.1,c:100:1600:0:true:127.0.0.1,d:100:1600:0:true:127.0.0.1,e:100:1600:0:true:127.0.0.1,f:100:1600:0:true:127.0.0.1,g:100:1600:0:true:127.0.0.1,h:100:1600:0:true:127.0.0.1
        run: cargo test --locked --release -p news-provider --test shared_bucket -- --ignored --nocapture measure
      - name: two senders at 100 ms, 4,500 sends each, beside one at 500 ms, 900 sends (bound A2 760 ms)
        if: ${{ !cancelled() }}
        env:
          SHARED_BUCKET_MEASURE: a:100:4500:0:true:127.0.0.1,b:100:4500:0:true:127.0.0.1,c:500:900:0:true:127.0.0.1
        run: cargo test --locked --release -p news-provider --test shared_bucket -- --ignored --nocapture measure
