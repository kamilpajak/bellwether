[package]
name = "news-provider"
version = "0.1.0"
edition = "2021"
description = "The provider seam: the coverage ledger's write half, and the only HTTP client in the workspace."
publish = false

# `ureq` is here and in no other manifest, which is what makes the one-crate HTTP allowlist a
# question `cargo metadata` can answer completely (docs/design/architecture.md section 8 row R4's
# first hole). Cost, measured 2026-11-13 by
# `cargo tree -e normal,build --workspace --prefix none | sed 's/ (\*)$//' | sort -u | wc -l`:
# 130 build units before this member, 151 after - this crate plus 20 packages, which is exactly the
# +20 the design measured for ureq alone. `ring` and `httparse` are the only C or build-script
# compiles among them.
[dependencies]
canon = { path = "../canon" }
chrono = "0.4.45"
pit = { path = "../pit" }
thiserror = "2.0.21"
# Default features only: `rustls` (over ring) and `gzip`. `http_status_as_error` is turned OFF in
# `Wire::new`, because a 403 carrying the vendor's own body is an answer the classifier reads.
ureq = "3.5.2"

[lints]
workspace = true
