[package]
name = "panel-contract"
version = "0.1.0"
edition = "2021"
description = "The panel manifest contract: schema, validator and `validate` subcommand for the derive-to-statistics file boundary."
publish = false

# Both are already in Cargo.lock (services/newsvault uses them), so this crate adds no package to
# the dependency graph - measured 2026-11-12 by diffing Cargo.lock before and after.

# Not here, and neither absence is an oversight: arrow, because this crate never opens the data
# file (the ceiling that follows is architecture.md section 8, fifth correction), and a time crate,
# because `cutoff` is required to be present and is not parsed.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
