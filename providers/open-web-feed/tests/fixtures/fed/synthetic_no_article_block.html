<!doctype html>
<!-- Synthetic: a Federal Reserve release page whose heading and release column sit outside any
     div#article, so the fed rule's container matches nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta property="og:title" content="A release with no article block"/>
<meta property="og:url" content="https://www.federalreserve.gov/newsevents/pressreleases/monetary20261112a.htm" />
<title>Federal Reserve Board - A release with no article block</title>
</head>
<body>
<div id="content" class="container container__main" role="main">
    <div class="row">
        <div id="main">
            <div class="heading col-xs-12 col-sm-8 col-md-8">
                <p class="article__time">November 12, 2026</p>
            </div>
            <div class="col-xs-12 col-sm-8 col-md-8">
                <p>A release paragraph outside every article block.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
