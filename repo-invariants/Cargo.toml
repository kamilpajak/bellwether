[package]
name = "repo-invariants"
version = "0.1.0"
edition = "2021"
description = "Repo-wide invariant checks: the section 8 gates that belong to no single service crate."
publish = false

# Normal dependencies rather than dev-dependencies: the checks ARE this crate's lib target, and a
# lib target cannot use dev-dependencies. Why a TOML parser is needed beside the `cargo metadata`
# reader: `read_verdict` in src/lib.rs.

# Measured 2026-11-12: `serde_json` 1.0.154 is already in Cargo.lock (services/newsvault uses it),
# so it adds no package. `toml` adds five - toml, toml_parser, toml_datetime, serde_spanned,
# winnow - and `default-features = false` drops a sixth, toml_writer, which writes TOML and is
# not needed to read it.
[dependencies]
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
