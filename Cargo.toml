# Workspace root. The memo names five services and each arrives as its own crate here; `derive`'s
# panel manifest is the first artefact that crosses a boundary, so its contract is a crate too.
# `providers/` holds one crate per vendor adapter. Each declares no HTTP dependency, which is what
# makes section 8 row R4's allowlist a one-crate question `cargo metadata` can answer.
# Why `repo-invariants` and `panel-contract` are crates of their own rather than code inside a
# service: CONTRIBUTING.md, "Everything else".
# `providers/*` and `services/*` are globs: a crate added there is a member by existing, which
# removes the mistake section 8 row G1 leaves instead of checking for it. Its cost, measured
# 2026-11-13 on cargo 1.99.1: a glob also matches a directory with no manifest, including a
# dotfile one, and such a directory fails EVERY cargo command with "failed to load manifest for
# workspace member ... referenced via `services/*`". The top-level crates stay explicit because
# `*` at the root would match `docs`, `probes` and `target` the same way.
[workspace]
members = [
    "canon",
    "news-provider",
    "panel-contract",
    "pit",
    "providers/*",
    "repo-invariants",
    "services/*",
]
resolver = "2"

# The lint floor for every crate in the workspace. Why it is here and not in a package table, and
# that inheritance is opt-in with nothing but row G1 checking for the stanza:
# docs/design/architecture.md section 8 rows G1 and R5.
[workspace.lints.rust]
unsafe_code = "forbid"
# R5. Warn-by-default in rustc, so CI's own `-D warnings` already made the bare `f();` form red
# before this entry existed - measured 2026-11-12 on the previous tree, clippy exit 101. What it
# adds is outside CI: `cargo check` and `cargo build` now exit 101 on that form instead of printing
# a warning. It does NOT catch `let _ = f()`.
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# clippy::panic covers only `panic!` itself, so `todo!()`, `unimplemented!()` and `unreachable!()`
# passed every check until these three lines existed - measured 2026-11-12.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# The second half of R5. `let _ = f()` emits nothing under `unused_must_use` and is
# allow-by-default in clippy, so a discarded Result otherwise leaves no trace at all.
let_underscore_must_use = "deny"
