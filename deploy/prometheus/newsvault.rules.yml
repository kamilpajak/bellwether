# Readers of the textfiles deploy/systemd/ writes: the hourly watchdog's newsvault.prom/1, the units'
# results, the backup's last copy and the shadow run's spend (the Modelgate* alerts; one group, as
# newsvault-monitoring-check reads one). A per-day count is aggregated without days_ago, so one day's
# alert keeps its labels (run_date) across UTC midnight. Thresholds: architecture.md S7-D8 and N1.
groups:
  - name: newsvault
    rules:
      # Two watchdog intervals of 3,600 s with no fresh read, or no read at all.
      - alert: NewsvaultWatchdogStale
        expr: |
          (time() - max(newsvault_ledger_at_timestamp_seconds{schema="newsvault.prom/1"})) > 7200
          or absent(newsvault_ledger_at_timestamp_seconds{schema="newsvault.prom/1"})
        labels:
          severity: critical
        annotations:
          summary: newsvault's watchdog has written no ledger read for over 2 h, or none of this schema.

      # Two longest poll periods (2 x 5,400 s) with no vendor request: more than one slot missed.
      - alert: NewsvaultCollectStale
        expr: newsvault_collect_last_asked_age_seconds > 10800
        labels:
          severity: critical
        annotations:
          summary: newsvault has sent no vendor request for {{ $value }} s.

      - alert: NewsvaultNeverAsked
        expr: |
          absent(newsvault_collect_last_asked_age_seconds)
          unless on() absent(newsvault_ledger_at_timestamp_seconds{schema="newsvault.prom/1"})
        labels:
          severity: critical
        annotations:
          summary: the watchdog reads a store no vendor request has reached.

      - alert: NewsvaultLedgerIncomplete
        expr: newsvault_ledger_complete == 0
        labels:
          severity: warning
        annotations:
          summary: the ledger could not read a run file, or an attempt has none (ledger exit 8).

      # S7-D8: a server's hold or slow-down cut a run.
      - alert: NewsvaultHostHeld
        expr: max without(days_ago) (newsvault_deferred_host_held) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.source }}: {{ $value }} request(s) deferred host_held, run date {{ $labels.run_date }}."

      # Section 12.8 step 9b: another sender kept the send gate from a request of a run.
      - alert: NewsvaultGateRefused
        expr: max without(days_ago) (newsvault_deferred_gate_refused) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }}: {{ $value }} request(s) deferred gate_refused, run date {{ $labels.run_date }}."

      # S7-D8: a deferred document closed after 24 h, never asked.
      - alert: NewsvaultDeferredExpired
        expr: max without(days_ago) (newsvault_carried_expired) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.source }}: {{ $value }} deferred row(s) expired, run date {{ $labels.run_date }}."

      # Persistent = 2 or more in a day: a manual poll inside a slot reads one by construction
      # (section 11.2); a changed link shape makes every scheduled poll range_unread.
      - alert: NewsvaultWalkRangeUnreadPersistent
        expr: max without(days_ago) (newsvault_walk_range_unread_polls) >= 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.source }}: {{ $value }} walked poll(s) read no range, run date {{ $labels.run_date }}."

      # S7-D7: a Retry-After above the 24 h ceiling, cut to it.
      - alert: NewsvaultHoldsCapped
        expr: max without(days_ago) (newsvault_holds_capped) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} Retry-After value(s) held to the 24 h ceiling, run date {{ $labels.run_date }}."

      - alert: NewsvaultWallTimeOverBound
        expr: max without(days_ago) (newsvault_check_findings{code="wall_time_over_bound"}) > 0
        labels:
          severity: warning
        annotations:
          summary: newsvault's runs took more than half a day of wall time, run date {{ $labels.run_date }}.

      - alert: NewsvaultHostBusyOverBound
        expr: max without(days_ago) (newsvault_check_findings{code="host_busy_over_bound"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} host(s) busy more than half a day, run date {{ $labels.run_date }}."

      # Yesterday only: today's runs are short until its last slot has run.
      - alert: NewsvaultRunsMissed
        expr: max without(days_ago) (newsvault_check_findings{code="runs_below_expected", days_ago="1"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.run_date }} saw fewer collect runs than its 31 slots."

      - alert: NewsvaultRowsZero
        expr: max without(days_ago) (newsvault_check_findings{code="rows_committed_zero_against_vendor_rows"}) > 0
        labels:
          severity: warning
        annotations:
          summary: a source listed vendor rows and committed no item, run date {{ $labels.run_date }}.

      # The collect unit's last ExecStopPost (deploy/systemd/newsvault-unit-result): a failed unit, or
      # an exit other than 0 and 8 (S7-D8), at the next evaluation instead of 3 h later.
      - alert: NewsvaultCollectFailed
        expr: |
          max by (unit) (newsvault_unit_result_success{unit="collect"} == 0)
          or max by (unit) (newsvault_unit_exit_status{unit="collect"} != 0 and newsvault_unit_exit_status{unit="collect"} != 8)
        labels:
          severity: critical
        annotations:
          summary: newsvault's last collect run failed, or exited other than 0 and 8.

      # Two daily intervals plus one run's bound (2 x 86,400 s + TimeoutStartSec 1,800 s + 90 s stop
      # timeout): the stamp is the run's start, written after its scan, so one missed day stays quiet.
      - alert: NewsvaultBackupStale
        expr: |
          (time() - max(newsvault_backup_last_success_timestamp_seconds)) > 174690
          or absent(newsvault_backup_last_success_timestamp_seconds)
        labels:
          severity: critical
        annotations:
          summary: no newsvault backup has reached Nextcloud for over 2 days, or none ever.

      - alert: NewsvaultBackupFailed
        expr: max by (unit) (newsvault_unit_result_success{unit="backup"} == 0)
        labels:
          severity: warning
        annotations:
          summary: the last newsvault backup run failed; at exit 8 the copy is up and old copies were not deleted or a blob pack is lost, altered or has no whole manifest or the store could not give a blob, otherwise no copy was made.

      # The roster unit's last ExecStopPost: a failed fetch, exit 8 included, is a roster day lost.
      - alert: NewsvaultRosterFailed
        expr: max by (unit) (newsvault_unit_result_success{unit="roster"} == 0)
        labels:
          severity: critical
        annotations:
          summary: newsvault's last roster fetch failed; that day's roster is not kept.

      # One daily interval plus one run's bound (86,400 s + TimeoutStartSec 180 s + 90 s stop
      # timeout): the stamp is written when a run ends, so a run that ends late stays quiet.
      - alert: NewsvaultRosterMissed
        expr: |
          (time() - max(newsvault_unit_result_timestamp_seconds{unit="roster"})) > 86670
          or absent(newsvault_unit_result_timestamp_seconds{unit="roster"})
        labels:
          severity: critical
        annotations:
          summary: no newsvault roster fetch has ended for over a day, or none ever.

      # The shadow unit's last ExecStopPost: a failed unit is the script's exit 8 (the envelope
      # names why), 2, 4, docker's 125 or a timeout; exit 7 succeeds (architecture.md section 3.5).
      - alert: ModelgateShadowFailed
        expr: max by (unit) (newsvault_unit_result_success{unit="shadow"} == 0)
        labels:
          severity: critical
        annotations:
          summary: the last modelgate shadow run failed; its envelope in the journal names why.

      # Two 1,800 s intervals plus one run's bound (TimeoutStartSec 1,500 s + 90 s stop timeout): the
      # stamp is written when a run ends at exit 0, so only a third firing without one is stale.
      - alert: ModelgateShadowStale
        expr: |
          (time() - max(modelgate_shadow_last_success_timestamp_seconds)) > 5190
          or absent(modelgate_shadow_last_success_timestamp_seconds)
        labels:
          severity: critical
        annotations:
          summary: no modelgate shadow run has ended at exit 0 for over 86 min, or none ever.

      - alert: ModelgateShadowCostCapReached
        expr: max(modelgate_shadow_cost_cap_reached) > 0
        labels:
          severity: critical
        annotations:
          summary: a cost cap refused a call in the last modelgate shadow run; nothing is labelled until the cap's scope ends or the timer is stopped.

      # 80% of the total cap, chosen 2026-11-23 before any spend: at 15 USD it leaves 3 USD.
      - alert: ModelgateShadowSpendNearTotalCap
        expr: |
          max(modelgate_shadow_spent_micro_usd{scope="total"}) / 1e6
          >= 0.8 * max(modelgate_shadow_cap_micro_usd{scope="total"}) / 1e6
        labels:
          severity: warning
        annotations:
          summary: the modelgate store has spent {{ $value }} USD, at least 80% of its total cap.

      # The gate's store: its answers were produced once, at observation time. The threshold is
      # NewsvaultBackupStale's (2 x 86,400 s + TimeoutStartSec 1,800 s + 90 s stop timeout).
      - alert: ModelgateBackupStale
        expr: |
          (time() - max(modelgate_backup_last_success_timestamp_seconds)) > 174690
          or absent(modelgate_backup_last_success_timestamp_seconds)
        labels:
          severity: critical
        annotations:
          summary: no copy of the modelgate store has reached Nextcloud for over 2 days, or none ever.

      - alert: ModelgateBackupFailed
        expr: max by (unit) (newsvault_unit_result_success{unit="gatebackup"} == 0)
        labels:
          severity: warning
        annotations:
          summary: the last modelgate backup run failed; at exit 7 a run held the shadow lock or a step to Nextcloud failed, at exit 8 the copy is up and old copies were not deleted.
