# `promtool test rules`, run by .github/workflows/deploy.yml: each alert fires on one side of its
# threshold and not on the other.
rule_files:
  - newsvault.rules.yml

evaluation_interval: 1m

tests:
  # Scraped each minute, as node-exporter re-reads the file: a read at t=0, a fresh one at 1 h, then
  # the same file until 5 h; stale once more than 2 h have passed since that read.
  - interval: 1m
    input_series:
      - series: 'newsvault_ledger_at_timestamp_seconds{schema="newsvault.prom/1"}'
        values: '0x59 3600x240'
      - series: 'newsvault_collect_last_asked_age_seconds'
        values: '10800x59 10801x60'
    alert_rule_test:
      - eval_time: 3h
        alertname: NewsvaultWatchdogStale
        exp_alerts: []
      - eval_time: 3h1m
        alertname: NewsvaultWatchdogStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: newsvault's watchdog has written no ledger read for over 2 h, or none of this schema.
      - eval_time: 0m
        alertname: NewsvaultCollectStale
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultCollectStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: newsvault has sent no vendor request for 10801 s.
      - eval_time: 1h
        alertname: NewsvaultNeverAsked
        exp_alerts: []

  # A schema other than newsvault.prom/1 is no read; a read with no age is a store never asked.
  - interval: 1h
    input_series:
      - series: 'newsvault_ledger_at_timestamp_seconds{schema="newsvault.prom/2"}'
        values: '0'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultWatchdogStale
        exp_alerts:
          - exp_labels:
              severity: critical
              schema: newsvault.prom/1
            exp_annotations:
              summary: newsvault's watchdog has written no ledger read for over 2 h, or none of this schema.

  # No watchdog file at all is the stale alert's to name, not the never-asked one's.
  - interval: 1h
    input_series:
      - series: 'up{job="node"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultNeverAsked
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'newsvault_ledger_at_timestamp_seconds{schema="newsvault.prom/1"}'
        values: '0'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultNeverAsked
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: the watchdog reads a store no vendor request has reached.

  - interval: 1h
    input_series:
      - series: 'newsvault_ledger_complete'
        values: '1 0'
      - series: 'newsvault_deferred_host_held{source="open_web_wires",run_date="2026-11-18",days_ago="0"}'
        values: '0 2'
      - series: 'newsvault_carried_expired{source="open_web_wires",run_date="2026-11-17",days_ago="1"}'
        values: '0 3'
      - series: 'newsvault_walk_range_unread_polls{source="open_web_wires",run_date="2026-11-18",days_ago="0"}'
        values: '1 2'
      - series: 'newsvault_holds_capped{run_date="2026-11-18",days_ago="0"}'
        values: '0 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultLedgerIncomplete
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultLedgerIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: the ledger could not read a run file, or an attempt has none (ledger exit 8).
      - eval_time: 0m
        alertname: NewsvaultHostHeld
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultHostHeld
        exp_alerts:
          - exp_labels:
              severity: critical
              source: open_web_wires
              run_date: "2026-11-18"
            exp_annotations:
              summary: "open_web_wires: 2 request(s) deferred host_held, run date 2026-11-18."
      - eval_time: 0m
        alertname: NewsvaultDeferredExpired
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultDeferredExpired
        exp_alerts:
          - exp_labels:
              severity: critical
              source: open_web_wires
              run_date: "2026-11-17"
            exp_annotations:
              summary: "open_web_wires: 3 deferred row(s) expired, run date 2026-11-17."
      - eval_time: 0m
        alertname: NewsvaultWalkRangeUnreadPersistent
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultWalkRangeUnreadPersistent
        exp_alerts:
          - exp_labels:
              severity: critical
              source: open_web_wires
              run_date: "2026-11-18"
            exp_annotations:
              summary: "open_web_wires: 2 walked poll(s) read no range, run date 2026-11-18."
      - eval_time: 0m
        alertname: NewsvaultHoldsCapped
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultHoldsCapped
        exp_alerts:
          - exp_labels:
              severity: critical
              run_date: "2026-11-18"
            exp_annotations:
              summary: "1 Retry-After value(s) held to the 24 h ceiling, run date 2026-11-18."

  # Findings: today's run shortfall is no alert, yesterday's is; each WARN code on its own.
  - interval: 1h
    input_series:
      - series: 'newsvault_check_findings{code="runs_below_expected",run_date="2026-11-18",days_ago="0"}'
        values: '1'
      - series: 'newsvault_check_findings{code="wall_time_over_bound",run_date="2026-11-18",days_ago="0"}'
        values: '1'
      - series: 'newsvault_check_findings{code="host_busy_over_bound",run_date="2026-11-17",days_ago="1"}'
        values: '2'
      - series: 'newsvault_check_findings{code="rows_committed_zero_against_vendor_rows",run_date="2026-11-18",days_ago="0"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultRunsMissed
        exp_alerts: []
      - eval_time: 0m
        alertname: NewsvaultWallTimeOverBound
        exp_alerts:
          - exp_labels:
              severity: warning
              code: wall_time_over_bound
              run_date: "2026-11-18"
            exp_annotations:
              summary: newsvault's runs took more than half a day of wall time, run date 2026-11-18.
      - eval_time: 0m
        alertname: NewsvaultHostBusyOverBound
        exp_alerts:
          - exp_labels:
              severity: warning
              code: host_busy_over_bound
              run_date: "2026-11-17"
            exp_annotations:
              summary: "2 host(s) busy more than half a day, run date 2026-11-17."
      - eval_time: 0m
        alertname: NewsvaultRowsZero
        exp_alerts:
          - exp_labels:
              severity: warning
              code: rows_committed_zero_against_vendor_rows
              run_date: "2026-11-18"
            exp_annotations:
              summary: a source listed vendor rows and committed no item, run date 2026-11-18.

  - interval: 1h
    input_series:
      - series: 'newsvault_check_findings{code="runs_below_expected",run_date="2026-11-17",days_ago="1"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultRunsMissed
        exp_alerts:
          - exp_labels:
              severity: warning
              code: runs_below_expected
              run_date: "2026-11-17"
            exp_annotations:
              summary: "2026-11-17 saw fewer collect runs than its 31 slots."

  # The collect unit's result each hour: exit 0, exit 8 (a partial run, SuccessExitStatus), exit 2,
  # killed by a signal (-1), a success whose exit is 7, then exit 0 while the backup unit fails.
  - interval: 1h
    input_series:
      - series: 'newsvault_unit_result_success{unit="collect"}'
        values: '1 1 0 0 1 1'
      - series: 'newsvault_unit_exit_status{unit="collect"}'
        values: '0 8 2 -1 7 0'
      - series: 'newsvault_unit_result_success{unit="backup"}'
        values: '1 1 1 1 1 0'
      - series: 'newsvault_unit_exit_status{unit="backup"}'
        values: '2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 0h
        alertname: NewsvaultCollectFailed
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultCollectFailed
        exp_alerts: []
      - eval_time: 2h
        alertname: NewsvaultCollectFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: collect
            exp_annotations:
              summary: newsvault's last collect run failed, or exited other than 0 and 8.
      - eval_time: 3h
        alertname: NewsvaultCollectFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: collect
            exp_annotations:
              summary: newsvault's last collect run failed, or exited other than 0 and 8.
      - eval_time: 4h
        alertname: NewsvaultCollectFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: collect
            exp_annotations:
              summary: newsvault's last collect run failed, or exited other than 0 and 8.
      - eval_time: 5h
        alertname: NewsvaultCollectFailed
        exp_alerts: []
      - eval_time: 0h
        alertname: NewsvaultBackupFailed
        exp_alerts: []

  # A backup at t=0, the file re-read each hour: fresh for 2 days, stale after; a failed run alerts.
  - interval: 1h
    input_series:
      - series: 'newsvault_backup_last_success_timestamp_seconds'
        values: '0x60'
      - series: 'newsvault_unit_result_success{unit="backup"}'
        values: '1 0'
    alert_rule_test:
      - eval_time: 48h
        alertname: NewsvaultBackupStale
        exp_alerts: []
      - eval_time: 49h
        alertname: NewsvaultBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: no newsvault backup has reached Nextcloud for over 2 days, or none ever.
      - eval_time: 0h
        alertname: NewsvaultBackupFailed
        exp_alerts: []
      - eval_time: 1h
        alertname: NewsvaultBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              unit: backup
            exp_annotations:
              summary: the last newsvault backup run failed; at exit 8 the copy is up and old copies were not deleted, otherwise no copy was made.
      - eval_time: 0h
        alertname: NewsvaultCollectFailed
        exp_alerts: []

  # No backup ever written is stale, not silent.
  - interval: 1h
    input_series:
      - series: 'up{job="node"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: no newsvault backup has reached Nextcloud for over 2 days, or none ever.

  # One missed day: the copy stamped 0, none a day later, the next run stamped 172,800 (its start)
  # and written at 48h10m: quiet while it writes.
  - interval: 5m
    input_series:
      - series: 'newsvault_backup_last_success_timestamp_seconds'
        values: '0x577 172800x10'
    alert_rule_test:
      - eval_time: 48h05m
        alertname: NewsvaultBackupStale
        exp_alerts: []

  # Two missed days: quiet at 174,600 s, stale at 174,900 s, either side of 174,690.
  - interval: 5m
    input_series:
      - series: 'newsvault_backup_last_success_timestamp_seconds'
        values: '0x720'
    alert_rule_test:
      - eval_time: 48h30m
        alertname: NewsvaultBackupStale
        exp_alerts: []
      - eval_time: 48h35m
        alertname: NewsvaultBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: no newsvault backup has reached Nextcloud for over 2 days, or none ever.

  # A collect the kernel killed (SERVICE_RESULT oom-kill) whose main process exited 0.
  - interval: 1h
    input_series:
      - series: 'newsvault_unit_result_success{unit="collect"}'
        values: '0'
      - series: 'newsvault_unit_exit_status{unit="collect"}'
        values: '0'
    alert_rule_test:
      - eval_time: 0h
        alertname: NewsvaultCollectFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: collect
            exp_annotations:
              summary: newsvault's last collect run failed, or exited other than 0 and 8.

  # One day's count read at 23:50 (days_ago 0), then at 00:50 (days_ago 1): one alert, whose labels
  # do not change at midnight, so it neither notifies again nor escapes its silence.
  - interval: 1m
    input_series:
      - series: 'newsvault_deferred_host_held{source="open_web_wires",run_date="2026-11-17",days_ago="0"}'
        values: '3x59'
      - series: 'newsvault_deferred_host_held{source="open_web_wires",run_date="2026-11-17",days_ago="1"}'
        values: '_x59 3x59'
    alert_rule_test:
      - eval_time: 30m
        alertname: NewsvaultHostHeld
        exp_alerts:
          - exp_labels:
              severity: critical
              source: open_web_wires
              run_date: "2026-11-17"
            exp_annotations:
              summary: "open_web_wires: 3 request(s) deferred host_held, run date 2026-11-17."
      - eval_time: 90m
        alertname: NewsvaultHostHeld
        exp_alerts:
          - exp_labels:
              severity: critical
              source: open_web_wires
              run_date: "2026-11-17"
            exp_annotations:
              summary: "open_web_wires: 3 request(s) deferred host_held, run date 2026-11-17."

  # A roster run ending at 24 h, the file re-read each 5 min: quiet through one day and one run's
  # bound, missed after; the next day's failed run alerts as failed. A non-zero stamp, so a rule
  # reading the 0/1 success gauge instead fires at 48h04m.
  - interval: 5m
    input_series:
      - series: 'newsvault_unit_result_timestamp_seconds{unit="roster"}'
        values: '86400x600'
      - series: 'newsvault_unit_result_success{unit="roster"}'
        values: '1x575 0x24'
    alert_rule_test:
      - eval_time: 48h04m
        alertname: NewsvaultRosterMissed
        exp_alerts: []
      - eval_time: 48h05m
        alertname: NewsvaultRosterMissed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: no newsvault roster fetch has ended for over a day, or none ever.
      - eval_time: 47h55m
        alertname: NewsvaultRosterFailed
        exp_alerts: []
      - eval_time: 48h
        alertname: NewsvaultRosterFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: roster
            exp_annotations:
              summary: newsvault's last roster fetch failed; that day's roster is not kept.
      - eval_time: 48h
        alertname: NewsvaultCollectFailed
        exp_alerts: []

  # No roster run ever is missed, not silent; absent() keeps the selector's unit label.
  - interval: 1h
    input_series:
      - series: 'up{job="node"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: NewsvaultRosterMissed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: roster
            exp_annotations:
              summary: no newsvault roster fetch has ended for over a day, or none ever.

  # The shadow: a success stamp at 1 h, then exit 8 with a cap reached from 2 h on. Stale once more
  # than 5,190 s have passed since the stamp (3,600 s + 5,190 s = 2h26m30s).
  - interval: 1m
    input_series:
      - series: 'modelgate_shadow_last_success_timestamp_seconds'
        values: '3600x240'
      - series: 'newsvault_unit_result_success{unit="shadow"}'
        values: '1x119 0x120'
      - series: 'modelgate_shadow_cost_cap_reached'
        values: '0x119 1x120'
      - series: 'modelgate_shadow_spent_micro_usd{scope="total"}'
        values: '11999999x119 12000000x120'
      - series: 'modelgate_shadow_spent_micro_usd{scope="day"}'
        values: '14000000x240'
      - series: 'modelgate_shadow_cap_micro_usd{scope="total"}'
        values: '15000000x240'
      - series: 'modelgate_shadow_cap_micro_usd{scope="day"}'
        values: '1000000x240'
    alert_rule_test:
      - eval_time: 1h59m
        alertname: ModelgateShadowFailed
        exp_alerts: []
      - eval_time: 2h
        alertname: ModelgateShadowFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              unit: shadow
            exp_annotations:
              summary: the last modelgate shadow run failed; its envelope in the journal names why.
      - eval_time: 2h
        alertname: NewsvaultCollectFailed
        exp_alerts: []
      - eval_time: 1h59m
        alertname: ModelgateShadowCostCapReached
        exp_alerts: []
      - eval_time: 2h
        alertname: ModelgateShadowCostCapReached
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: a cost cap refused a call in the last modelgate shadow run; nothing is labelled until the cap's scope ends or the timer is stopped.
      - eval_time: 1h59m
        alertname: ModelgateShadowSpendNearTotalCap
        exp_alerts: []
      - eval_time: 2h
        alertname: ModelgateShadowSpendNearTotalCap
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: the modelgate store has spent 12 USD, at least 80% of its total cap.
      - eval_time: 2h26m
        alertname: ModelgateShadowStale
        exp_alerts: []
      - eval_time: 2h27m
        alertname: ModelgateShadowStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: no modelgate shadow run has ended at exit 0 for over 86 min, or none ever.

  # No shadow run ever is stale, not silent.
  - interval: 1h
    input_series:
      - series: 'up{job="node"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: ModelgateShadowStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: no modelgate shadow run has ended at exit 0 for over 86 min, or none ever.
      - eval_time: 0m
        alertname: ModelgateShadowFailed
        exp_alerts: []
