[package]
name = "snapshot-contract"
version = "0.1.0"
edition = "2021"
description = "The Snapshot contract (vault to derive): column list, manifest fields, the shared visibility predicate, the writer, the validator and its `validate` subcommand."
publish = false

# Every package below was already in Cargo.lock before this crate (newsvault and panel-contract use
# them), so the dependency graph gains this crate alone. It must not depend on `newsvault`, which
# depends on it: CONTRIBUTING.md, "Everything else", on contract crates.
[dependencies]
arrow = "60.1.0"
canon = { path = "../canon" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
const-hex = "1.19.3"
parquet = "60.1.0"
pit = { path = "../pit" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.27.0"
