[package]
name = "canon"
version = "0.1.0"
edition = "2021"
description = "The canonical form every digest in architecture.md section 2 is taken over, and the seven digests themselves."
publish = false

# Cost, measured 2026-11-12. `cargo tree -e normal,build --workspace --prefix none | sort -u`:
# 112 build units before this crate, 124 after, so 11 compiled packages plus canon itself. Nine of
# the eleven are sha2's and const-hex's; the other two are unicode-normalization and its tinyvec,
# which the design's +37 figure left out. `cargo metadata --format-version 1` counts 152 before and
# 172 after, and the eight it counts beyond the build graph are dev-dependencies of dependencies -
# proptest and rand among them - which are resolved into Cargo.lock and never compiled.
[dependencies]
chrono = "0.4.45"
# `format!("{:x}", Sha256::digest(..))` does not compile against 0.11: the output is a
# hybrid-array `Array<u8, U32>` with no `LowerHex` impl - measured 2026-11-12, E0277.
const-hex = "1.19.3"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
